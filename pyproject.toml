[project]
name = "avn-news-scraper"
version = "0.1.0"
description = "Daily scraper for human-rights news from Bangladeshi outlets (Bangla + English)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    "selectolax>=0.3.21",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "typer>=0.12",
    "rich>=13.0",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
avn = "avn_scraper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avn_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
