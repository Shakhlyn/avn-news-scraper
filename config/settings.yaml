# Runtime settings. Paths are relative to the project root unless absolute.
timezone: Asia/Dhaka
data_dir: data

# How far back to look on each run. The service scrapes daily at 23:30 (Asia/Dhaka); 30h
# reaches back to 17:30 the day before, so the 6 h overlap with the previous run catches
# stories published or dated late. Articles the previous run already stored or judged
# (seen_urls) are not downloaded again.
window_hours: 30

# When the service (`avn serve`) starts the daily scrape, in `timezone`. If it was not
# running then, it scrapes soon after it starts.
daily_at: "23:30"

http:
  user_agent: "Mozilla/5.0 (compatible; AVNNewsScraper/0.1; human-rights news monitoring)"
  robots_agent: AVNNewsScraper
  timeout_seconds: 25       # longest wait for the next bit of data
  # Longest one request may take in total (redirects and the whole page), so a server that
  # trickles data, or a stuck connection, can't hang the run. Per page, not per outlet: a slow
  # outlet with many pages is not cut short. Normal pages take a few seconds. A request that
  # runs over counts as a timeout (retried, and toward error_threshold).
  request_deadline_seconds: 180
  concurrency: 32          # total parallel requests
  per_host_delay: 1.0      # seconds between requests to the same site
  per_host_jitter: 0.5     # plus a random 0-50% of that, so requests have no fixed rhythm
  retries: 2
  respect_robots: true
  max_response_mb: 20      # larger responses are dropped
  # Block protection: never push a site into banning our IP. After block_threshold
  # block answers in a row (403, 429, bot-challenge page) the site gets no more requests
  # this run, and none for block_cooldown_hours (saved in data/cache/host_blocks.json, so
  # check-sources and dry runs skip it too; delete its entry to retry sooner). A 429 asking
  # to wait more than max_retry_after seconds stops the site at once.
  block_threshold: 3
  block_cooldown_hours: 12
  max_retry_after: 120
  # After error_threshold timeouts / connection errors in a row (each retry counts) the site
  # gets no more requests this run. No cooldown: the next run tries it again.
  error_threshold: 5
  # Outlets with `fetch: impersonate` (sources.yaml) are fetched with a Chrome TLS
  # fingerprint (curl_cffi), at least impersonate_delay seconds apart.
  impersonate: chrome
  impersonate_delay: 3.0

# A run logs a progress line this often, in seconds (outlets scanned, articles downloaded,
# requests sent, sites stopped). A full run takes about 40 min and mostly waits between paced
# requests, so this is how to tell a slow run from a stuck one. 0 turns it off.
progress_seconds: 60

# Every new article in the window is downloaded and judged on its full text, so a story
# with a plain headline (or deep in a tab or the print edition) is not missed.
# prefilter: true downloads only links whose headline, summary or URL has a keyword (faster,
# misses some). `avn run --prefilter/--no-prefilter` overrides it.
prefilter: false
# Optional cap on downloads per outlet per run (newest kept). Empty = no cap. Articles left
# out are counted in the run's stats as `capped`.
max_articles_per_source:

# Section tabs and print edition. On every run the homepage is read for the print
# edition / e-paper article list on the outlet's own site and for the top-level tabs
# of the main menu (national, international, latest, ...; no sub-tabs, tags, videos,
# logins). Each one is scanned together with any `sections:` from sources.yaml, and
# its "next page" links are followed until its dated items are older than
# window_hours, or it is mostly articles the previous run already saw.
# See docs/scraping-rules.md.
sections:
  auto_discover: true
  max_per_source: 60   # safety cap on tabs per outlet
  max_pages: 20        # safety cap on pages per tab
  date_probe: 3        # regional outlets: a tab page without dates is judged by its last 3 articles (0 = off)

# Backfill of past months (`avn backfill 2025-05`). Old articles come from the outlets'
# archive sitemaps. A backfill runs for hours, so each site is read more slowly than in
# the daily run; the block breaker and cooldown above still apply. It waits while the
# daily scrape runs. See docs/scraping-rules.md.
backfill:
  per_host_delay: 2.0     # seconds between requests to one site (plus per_host_jitter)
  # Sitemap entries with no headline (no title, URL ends in an id such as Prothom Alo's
  # /uyrdgbm7hw) can't be keyword-filtered: download them to judge (complete, slower)
  # or skip them.
  untitled: download      # download | skip
  pause_poll_seconds: 30  # how often a paused backfill checks if the daily scrape ended

# Keep the auto-discovered feed/sitemap URLs this many days before re-discovering.
endpoint_cache_days: 7

# Catch-all search across *all* outlets (finds minor/local papers not in sources.yaml).
# Uses Bing News RSS. Bing's feed terms allow "personal, non-commercial use" in an RSS
# aggregator, so check that your use fits before enabling. (Google News RSS is not used:
# its robots.txt disallows automated access to /rss.)
search_catchall:
  enabled: false
  provider: bing
  max_items: 200

