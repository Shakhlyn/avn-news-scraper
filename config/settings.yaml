# Runtime settings. Paths are relative to the project root unless absolute.
timezone: Asia/Dhaka
data_dir: data

# How far back to look on each run. The job runs daily at 07:00 (Asia/Dhaka), so
# 24h covers exactly the news since the previous run.
window_hours: 24

http:
  user_agent: "Mozilla/5.0 (compatible; AVNNewsScraper/0.1; human-rights news monitoring)"
  robots_agent: AVNNewsScraper
  timeout_seconds: 25
  concurrency: 12          # total parallel requests
  per_host_delay: 1.0      # seconds between requests to the same site
  retries: 2
  respect_robots: true
  max_response_mb: 20      # larger responses are dropped

# Upper bound on full-article downloads per outlet per run (after keyword pre-filter).
max_articles_per_source: 80

# Section tabs and print edition. On every run the homepage is read for the print
# edition / e-paper article list on the outlet's own site and for the top-level tabs
# of the main menu (national, international, latest, ...; no sub-tabs, tags, videos,
# logins). Each one is scanned together with any `sections:` from sources.yaml, and
# its "next page" links are followed until its dated items are older than
# window_hours, or it is mostly articles the previous run already saw.
# See docs/scraping-rules.md.
sections:
  auto_discover: true
  max_per_source: 60   # safety cap on tabs per outlet
  max_pages: 20        # safety cap on pages per tab

# Keep the auto-discovered feed/sitemap URLs this many days before re-discovering.
endpoint_cache_days: 7

# Catch-all search across *all* outlets (finds minor/local papers not in sources.yaml).
# Uses Bing News RSS. Bing's feed terms allow "personal, non-commercial use" in an RSS
# aggregator, so check that your use fits before enabling. (Google News RSS is not used:
# its robots.txt disallows automated access to /rss.)
search_catchall:
  enabled: false
  provider: bing
  max_items: 200

# The news watch file (`avn publish`): the articles stored in the last `hours` hours,
# uploaded to Cloudflare R2 as staging/news.json. The team reviews it on
# staging.avnbd.org/dashboard; avnbd.org shows only the stories they accept. The bucket
# and its credentials come from the environment: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET.
publish:
  hours: 24
