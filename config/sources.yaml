# News outlets to scan.
#
#   id:        short unique key (used in folder names)
#   language:  bn | en
#   type:      national | online | tv | regional | agency
#   district:  for regional papers
#   homepage:  always scanned for headline links
#   feeds:     RSS/Atom URLs (optional)
#   sitemaps:  sitemap / news-sitemap URLs (optional)
#   sections:  extra listing pages to scan for headline links (e.g. crime, law, national)
#   auto_sections: set false to scan only the listed `sections`, not the tabs found
#              in the homepage menu (see settings.yaml -> sections)
#   enabled:   set false to skip
#
# If feeds and sitemaps are both empty, they are auto-discovered from the homepage
# <link rel="alternate"> tags and robots.txt "Sitemap:" lines, and cached.
# Run `avn check-sources` to see what works for each outlet.
#
# Outlets marked "403 bot protection" block automated requests (even with a browser
# User-Agent), so they are disabled. Their articles can still be picked up as
# headline + snippet through the optional search catch-all (settings.yaml).
# Dhaka Post and Jugantor block article pages but leave RSS / sitemap open, so
# matching articles are stored from the headline (+ RSS summary) with body_missing = 1.
# Channel 24 renders pages with JavaScript; it is read through its API (adapters.py).

