# Queries for the optional search catch-all (settings.yaml -> search_catchall).
# One search per line; keep them short and specific.
catchall_queries:
  - '"extrajudicial killing" Bangladesh'
  - crossfire RAB OR police Bangladesh
  - বন্দুকযুদ্ধ
  - ক্রসফায়ার
  - '"border killing" BSF'
  - বিএসএফের গুলি
  - সীমান্তে হত্যা
  - '"enforced disappearance" Bangladesh'
  - গুম
  - আয়নাঘর
  - '"custodial death" Bangladesh'
  - হেফাজতে মৃত্যু
  - রিমান্ডে নির্যাতন
  - '"shot in the leg" Bangladesh police'
  - পায়ে গুলি
  - '"death sentence" Bangladesh'
  - মৃত্যুদণ্ড
  - '"Cyber Security" Act OR Ordinance Bangladesh case'
  - ডিজিটাল নিরাপত্তা আইন
  - সাইবার নিরাপত্তা আইন
