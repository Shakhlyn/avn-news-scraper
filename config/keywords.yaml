# Topic keyword rules.
#
# Each category has:
#   strong:  phrases that on their own make an article relevant (weight 4)
#   weak:    supporting phrases; need several hits or a headline hit (weight 1)
#   exclude: phrases that veto the category (use sparingly)
#
# Scoring: each matched term adds weight x min(body occurrences, 3), plus weight x 2
# when it appears in the headline. An article belongs to a category when the
# score is >= min_score AND at least one strong term matched (require_strong).
# Weak terms alone never qualify an article; they raise the score of articles
# that have a strong hit. One article can belong to several categories.
#
# Matching is done on normalized text: lower-cased, Unicode NFC, Bangla digits
# turned into ASCII digits (৫৭ -> 57), zero-width joiners removed. Spaces in a
# phrase match any whitespace. English phrases match whole words (a trailing
# plural "s" is allowed); Bangla phrases match at a word start and allow any
# suffix (গুলি -> গুলিতে, গুলির).
#
# Prefix a term with "re:" to write a Python regular expression instead.
#
# After editing, run `avn reclassify` to re-apply the rules to stored articles.

settings:
  min_score: 4
  strong_weight: 4
  weak_weight: 1
  title_bonus: 2
  body_cap: 3
  require_strong: true

categories:
  extrajudicial_killing:
    label: Extrajudicial killing
    strong:
      - extrajudicial
      - extra-judicial
      - extra judicial
      - crossfire
      - cross-fire
      - encounter killing
      - "re:(gunfight|gun ?battle|shootout|shoot-out|exchange of fire|encounter)\\W+(\\w+\\W+){0,3}(with|between|involving)\\W+(the\\W+)?(rab|police|detective|db|bgb|army|coast ?guard|joint forces|law enforcers)"
      - বিচারবহির্ভূত
      - বিচার বহির্ভূত
      - বিচারবহির্ভুত
      - ক্রসফায়ার
      - ক্রস ফায়ার
      - বন্দুকযুদ্ধ
      - বন্দুক যুদ্ধ
      - "re:(র‍?্যাব|পুলিশ|ডিবি|যৌথ বাহিনী)\\S*\\s+(\\S+\\s+){0,3}(সঙ্গে|সাথে)\\s+(\\S+\\s+){0,2}(গোলাগুলি|বন্দুকযুদ্ধ)"
    weak:
      - gunfight
      - shootout
      - killed in encounter
      - গোলাগুলিতে নিহত
      - এনকাউন্টার
      - শুটআউট

  border_killing:
    label: Border killing
    strong:
      - border killing
      - killed by bsf
      - shot dead by bsf
      - bsf firing
      - bsf fire
      - bsf killing
      - bsf torture
      - "re:(killed|shot|beaten|tortured|injured)\\W+(\\w+\\W+){0,4}(by\\W+)?(indian\\W+)?(bsf|border security force)"
      - "re:(bsf|border security force)\\W+(\\w+\\W+){0,3}(shot|shoots|opened fire|fired|kill|killed|beat|beats|tortured)"
      - সীমান্ত হত্যা
      - সীমান্তে হত্যা
      - বিএসএফের গুলি
      - বিএসএফের নির্যাতন
      - বিএসএফের হাতে নিহত
      - "re:সীমান্তে\\S*\\s+(\\S+\\s+){0,4}(নিহত|গুলিবিদ্ধ|গুলিতে)"
      - "re:বিএসএফ\\S*\\s+(\\S+\\s+){0,4}(গুলি|নির্যাতন|হত্যা|পিটিয়ে)"
    weak:
      - bsf
      - border security force
      - felani
      - বিএসএফ
      - ফেলানী
      - সীমান্তে

  enforced_disappearance:
    label: Enforced disappearance
    strong:
      - enforced disappearance
      - forced disappearance
      - aynaghar
      - aynaghor
      - ayna ghar
      - mayer daak
      - "re:picked up by\\W+(\\w+\\W+){0,3}(plain ?clothes|plainclothes|law enforcers|men claiming)"
      # গুম, excluding "লাশ গুম" / "মরদেহ গুম" (hiding a body)
      - "re:(?<!লাশ )(?<!মরদেহ )(?<![\\u0980-\\u09ff])গুম(?:ের|ে|ও|ই|কৃত)?(?![\\u0980-\\u09ff])"
      - আয়নাঘর
      - আয়না ঘর
      - মায়ের ডাক
      - "re:সাদা পোশাক\\S*\\s+(\\S+\\s+){0,5}(তুলে নি|তুলে নে|আটক|ধরে নি)"
    weak:
      - disappeared
      - disappearance
      - abducted
      - plainclothes
      - তুলে নিয়ে
      - নিখোঁজ
      - সাদা পোশাক

  custodial_torture_death:
    label: Custodial torture and death
    strong:
