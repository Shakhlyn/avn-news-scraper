      - মৃত্যুদণ্ড
      - মৃত্যুদন্ড
      - ফাঁসির আদেশ
      - ফাঁসির রায়
      - ফাঁসির দণ্ড
      - ফাঁসি কার্যকর
      - কনডেম সেল
      - ডেথ রেফারেন্স
    weak:
