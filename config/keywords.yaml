      - custodial torture
      - custodial killing
      - death in custody
      - torture in custody
      - torture in remand
      - "re:(death|died|dies|dead|killed|tortured)\\W+(\\w+\\W+){0,3}in\\W+(\\w+'?\\W+){0,2}custody"
      - "re:tortur\\w*\\W+(\\w+\\W+){0,3}(in|during)\\W+(\\w+\\W+){0,2}(custody|remand)"
      - হেফাজতে মৃত্যু
      - হেফাজতে নির্যাতন
      - রিমান্ডে নির্যাতন
      - থানায় নির্যাতন
      - কারাগারে মৃত্যু
      - কারা হেফাজতে
      - "re:হেফাজতে\\S*\\s+(\\S+\\s+){0,3}(মৃত্যু|নির্যাতন|মারা)"
      - "re:(রিমান্ডে|থানায়|কারাগারে)\\S*\\s+(\\S+\\s+){0,3}(নির্যাতন|মৃত্যু|মারা)"
    weak:
      - in custody
      - remand
      - পুলিশ হেফাজতে
      - হেফাজতে
      - রিমান্ড

  kneecapping:
    label: Kneecapping (shooting in the leg)
    strong:
      - kneecapping
      - knee-capping
      - knee capping
      - shot in the leg
      - shot in his leg
      - shot in the knee
      - "re:shot\\W+(\\w+\\W+){0,3}(in|on)\\W+(the|his|her|their|both)\\W+(legs?|knees?)"
      - পায়ে গুলি
      - হাঁটুতে গুলি
      - "re:(পায়ে|হাঁটুতে|পায়ের)\\s+(\\S+\\s+){0,2}গুলি"
    weak:
      - leg injury
      - গুলিবিদ্ধ

  death_penalty:
