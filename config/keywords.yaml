      - ডিজিটাল নিরাপত্তা আইন
      - সাইবার নিরাপত্তা আইন
      - সাইবার নিরাপত্তা অধ্যাদেশ
      - সাইবার সুরক্ষা অধ্যাদেশ
      - আইসিটি আইন
